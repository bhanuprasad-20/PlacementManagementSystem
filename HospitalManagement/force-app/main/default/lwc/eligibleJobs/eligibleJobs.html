<template>

    <lightning-card title="Eligible Jobs">

        <div class="slds-p-around_medium">

            <p>Eligible Jobs Component is working.</p>

            <!-- Display Job Cards -->
            <template if:true={jobs}>
                <template for:each={jobs} for:item="job">

                    <div key={job.Id} class="slds-m-bottom_medium">

                        <c-job-card
                            job={job}
                            onapply={handleApply}
                            onviewdetails={handleViewDetails}>
                        </c-job-card>

                    </div>

                </template>
            </template>

            <!-- Empty State -->
    <template if:false={jobs.length}>
        <c-empty-state
            message="No eligible jobs found.">
        </c-empty-state>
    </template>


            

            <!-- Selected Job Details -->
            <template if:true={selectedJob}>

                 <p>SELECTED JOB FOUND!</p>   

                <lightning-card title="Job Details">

        <div class="slds-p-around_medium">

            <p>
                <strong>Job Title:</strong>
                {selectedJob.job_Title__c}
            </p>

            <p>
                <strong>Company:</strong>
                {selectedJob.company_name__c}
            </p>

            <p>
                <strong>Department:</strong>
                {selectedJob.Department__c}
            </p>

            <p>
                <strong>Minimum CGPA:</strong>
                {selectedJob.mimnum_cgp__c}
            </p>

            <p>
                <strong>Closing Date:</strong>
                {selectedJob.closing_date__c}
            </p>

        </div>

    </lightning-card>

</template>

            <!-- Success / Error Message -->
<template if:true={message}>
    <div class="slds-m-top_medium">
        <p>{message}</p>
    </div>
</template>

<!-- Student Profile -->
<div class="slds-m-top_large">

    <c-student-profile
        onprofileupdate={handleProfileUpdate}>
    </c-student-profile>

</div>

</div>

</lightning-card>

</template>
