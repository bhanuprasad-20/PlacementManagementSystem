<template>

    <lightning-card title={job.job_Title__c}>

        <div class="slds-p-around_medium">

            <p>
                <strong>Company:</strong>
                {job.company_name__c}
            </p>

            <p>
                <strong>Department:</strong>
                {job.Department__c}
            </p>

            <p>
                <strong>Minimum CGPA:</strong>
                {job.mimnum_cgp__c}
            </p>

            <p>
                <strong>Closing Date:</strong>
                {job.closing_date__c}
            </p>

            <div class="slds-m-top_medium">

                <lightning-button
                    label="Apply"
                    variant="brand"
                    onclick={handleApply}>
                </lightning-button>

                <lightning-button
                     label="View Details"
                     onclick={handleViewDetails}>
                </lightning-button>

            </div>

        </div>

    </lightning-card>

</template>
